<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;color:var(--text);

.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;pointer-events:none}

.b{width:400px;height:400px;background:#7a5cff;bottom:-100px;right:-80px}
.wrap{position:relative;z-index:1;width:min(640px,100%);text-align:center;perspective:900px}
.panel{background:var(--glass);border:1px solid var(--edge);border-radius:32px;padding:clamp(26px,6vw,50px);

transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s}
small{color:var(--pink);letter-spacing:.08em}
h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:6px 0 4px}
.sub{color:var(--soft);font-size:.92rem;margin-bottom:26px}

.count{color:var(--pink);margin:14px 0 20px;font-size:.9rem}
button{font:inherit;color:#fff;border:1px solid var(--edge);background:rgba(255,255,255,.12);padding:11px 22px;border-radius:999px;cursor:pointer;margin:4px;transition:.2s}
button:hover{background:rgba(255,255,255,.22)}
.main{background:var(--hot);border-color:var(--hot);box-shadow:0 10px 26px -6px var(--hot)}
.from{margin-top:22px;color:var(--soft);font-style:italic}
#all{display:none;text-align:left;margin-top:20px;max-height:50vh;overflow-y:auto;padding-right:6px}
#all p{padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:.95rem}
#all b{color:#ff8fb8;margin-right:8px}
</style></head><body>

function show(){m.style.opacity=0;setTimeout(function(){m.textContent=M[i];m.style.opacity=1;

function toggleAll(){var a=document.getElementById("all"),on=a.style.display!=="block";
